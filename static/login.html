<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SQUILLA CONSOLE / 登录</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icon/icon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/icon/icon-16.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon/icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/icon/icon-180.png" />
<link rel="shortcut icon" href="/favicon.ico" />
<style>
/* The login page is served to unauthenticated visitors, so it must not pull
   anything from /static (that path is behind the session gate). Everything —
   tokens, layout, the one icon — is inlined here on purpose. */

@font-face {
  font-family: "SpaceGrotesk";
  src: local("Space Grotesk");
  font-display: swap;
}

:root {
  --ink-000: #05060a;
  --ink-100: #0c0f18;
  --ink-200: #12161f;
  --ink-300: #1a1f2b;
  --ink-400: #262d3c;

  --pearl: #f2f4f8;
  --dust: #9aa4b8;
  /* Lifted from the console's #5d6779: on this near-black card that tone only
     reaches ~3:1, short of the 4.5:1 WCAG AA needs for the gateway address and
     subtitle, which are both real information rather than decoration. */
  --dust-dim: #8b96aa;

  --spec-cyan: #35f2e6;
  --spec-blue: #4a7dff;
  --spec-violet: #9b5cff;
  --spec-magenta: #ff3ea5;
  --bad: #ff4d6a;

  --edge: color-mix(in oklab, var(--pearl) 9%, transparent);
  --edge-hot: color-mix(in oklab, var(--spec-cyan) 34%, transparent);

  --sans: "SpaceGrotesk", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
    "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: "JetBrains Mono", "SFMono-Regular", "Menlo", "Consolas",
    "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--ink-000);
  color: var(--pearl);
  font-family: var(--sans);
  display: grid;
  place-items: center;
  overflow: hidden;
  position: relative;
}

/* ---------------------------------------------------------------- backdrop */

.bloom {
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  opacity: .5;
  pointer-events: none;
  animation: drift 26s ease-in-out infinite alternate;
}

.bloom--a {
  width: 46vw; height: 46vw;
  left: -12vw; top: -14vw;
  background: radial-gradient(circle, var(--spec-blue), transparent 68%);
}

.bloom--b {
  width: 40vw; height: 40vw;
  right: -10vw; bottom: -16vw;
  background: radial-gradient(circle, var(--spec-magenta), transparent 68%);
  animation-delay: -9s;
}

@keyframes drift {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to   { transform: translate3d(3vw, 4vh, 0) scale(1.14); }
}

.grid {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(color-mix(in oklab, var(--pearl) 4%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in oklab, var(--pearl) 4%, transparent) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 72%);
  -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 72%);
}

/* ------------------------------------------------------------------- card */

.card {
  position: relative;
  width: min(408px, calc(100vw - 40px));
  padding: 38px 34px 30px;
  background: color-mix(in oklab, var(--ink-100) 88%, transparent);
  border: 1px solid var(--edge);
  border-radius: 20px;
  backdrop-filter: blur(18px);
  box-shadow:
    0 32px 80px -30px #000,
    inset 0 1px 0 color-mix(in oklab, var(--pearl) 7%, transparent);
  animation: rise .5s cubic-bezier(.2, .8, .2, 1) both;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(14px) scale(.985); }
  to   { opacity: 1; transform: none; }
}

/* Spectral hairline along the top edge — the console's signature. */
.card::before {
  content: "";
  position: absolute;
  inset: -1px -1px auto -1px;
  height: 1px;
  border-radius: 20px 20px 0 0;
  background: linear-gradient(90deg,
    transparent, var(--spec-cyan), var(--spec-violet), var(--spec-magenta), transparent);
  opacity: .85;
}

.mark {
  width: 46px; height: 46px;
  display: grid;
  place-items: center;
  border: 1px solid var(--edge-hot);
  border-radius: 13px;
  color: var(--spec-cyan);
  background: color-mix(in oklab, var(--spec-cyan) 8%, transparent);
}

.mark svg { width: 22px; height: 22px; }

h1 {
  margin: 20px 0 4px;
  font-size: 27px;
  font-weight: 600;
  letter-spacing: -.02em;
}

.sub {
  margin: 0 0 26px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--dust-dim);
}

label {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--dust);
  margin-bottom: 8px;
}

.field { position: relative; }

input {
  width: 100%;
  padding: 13px 44px 13px 14px;
  font-family: var(--mono);
  font-size: 14px;
  color: var(--pearl);
  background: var(--ink-200);
  border: 1px solid var(--ink-400);
  border-radius: 11px;
  outline: none;
  transition: border-color .18s, box-shadow .18s;
}

input:focus {
  border-color: var(--edge-hot);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--spec-cyan) 13%, transparent);
}

.reveal {
  position: absolute;
  top: 50%; right: 6px;
  transform: translateY(-50%);
  width: 32px; height: 32px;
  display: grid;
  place-items: center;
  background: none;
  border: 0;
  border-radius: 8px;
  color: var(--dust-dim);
  cursor: pointer;
  transition: color .16s, background .16s;
}

.reveal:hover { color: var(--pearl); background: var(--ink-300); }
.reveal svg { width: 16px; height: 16px; }

button.go {
  width: 100%;
  margin-top: 18px;
  padding: 13px;
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .01em;
  color: var(--ink-000);
  background: linear-gradient(100deg, var(--spec-cyan), var(--spec-blue));
  border: 0;
  border-radius: 11px;
  cursor: pointer;
  transition: transform .16s cubic-bezier(.2, .8, .2, 1), box-shadow .16s, filter .16s;
}

button.go:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 10px 28px -12px var(--spec-blue);
  filter: brightness(1.06);
}

button.go:active:not(:disabled) { transform: translateY(0); }

button.go:disabled { opacity: .55; cursor: not-allowed; }

.err {
  display: none;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  padding: 10px 12px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--bad);
  background: color-mix(in oklab, var(--bad) 10%, transparent);
  border: 1px solid color-mix(in oklab, var(--bad) 26%, transparent);
  border-radius: 9px;
}

.err.on {
  display: flex;
  animation: shake .32s ease;
}

.err svg { width: 14px; height: 14px; flex: none; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25%      { transform: translateX(-5px); }
  75%      { transform: translateX(5px); }
}

.foot {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--edge);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--dust-dim);
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

@media (prefers-reduced-motion: reduce) {
  .bloom, .card, .err.on { animation: none; }
  button.go:hover:not(:disabled) { transform: none; }
}

@media (max-width: 480px) {
  .card {
    width: calc(100vw - 28px);
    padding: 28px 22px 24px;
  }
  h1 { font-size: 24px; margin-top: 16px; }
  .sub { font-size: 10px; margin-bottom: 22px; }
  input {
    font-size: 16px; /* iOS no-zoom threshold */
    padding: 12px 40px 12px 13px;
  }
  button { font-size: 13px; padding: 12px; }
  .bloom { opacity: 0.3; }
}
</style>
</head>
<body>

<div class="bloom bloom--a"></div>
<div class="bloom bloom--b"></div>
<div class="grid"></div>

<main class="card">
  <div class="mark">
    <!-- lucide: square-terminal -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m7 11 2-2-2-2" /><path d="M11 13h4" />
      <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
    </svg>
  </div>

  <h1>SQUILLA CONSOLE</h1>
  <p class="sub">Operator access required</p>

  <form id="form" autocomplete="off">
    <label for="pw">访问密码</label>
    <div class="field">
      <input id="pw" type="password" placeholder="请输入访问密码"
             autocomplete="current-password" required autofocus />
      <button class="reveal" id="reveal" type="button"
              aria-label="显示密码" title="显示密码">
        <!-- lucide: eye -->
        <svg id="ic-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>
    </div>

    <button class="go" id="go" type="submit">进入控制台</button>
  </form>

  <div class="err" id="err">
    <!-- lucide: shield-alert -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
      <path d="M12 8v4" /><path d="M12 16h.01" />
    </svg>
    <span id="err-text"></span>
  </div>

  <div class="foot">
    <span>OpenSquilla</span>
    <span id="gw">Gateway 127.0.0.1:18791</span>
  </div>
</main>

<script>
const form = document.getElementById("form");
const pw = document.getElementById("pw");
const go = document.getElementById("go");
const err = document.getElementById("err");
const errText = document.getElementById("err-text");
const reveal = document.getElementById("reveal");

const EYE = document.getElementById("ic-eye").innerHTML;
const EYE_OFF = `
  <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" />
  <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
  <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" />
  <path d="m2 2 20 20" />`;

reveal.addEventListener("click", () => {
  const show = pw.type === "password";
  pw.type = show ? "text" : "password";
  document.getElementById("ic-eye").innerHTML = show ? EYE_OFF : EYE;
  reveal.title = reveal.ariaLabel = show ? "隐藏密码" : "显示密码";
  pw.focus();
});

function fail(msg) {
  errText.textContent = msg;
  err.classList.remove("on");
  // Restart the shake even when the same message repeats.
  void err.offsetWidth;
  err.classList.add("on");
  pw.select();
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  err.classList.remove("on");
  go.disabled = true;
  go.textContent = "验证中…";

  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ password: pw.value }),
    });
    const body = await res.json().catch(() => ({}));

    if (res.ok && body.ok) {
      go.textContent = "已通过";
      location.replace("/");
      return;
    }
    fail(body.detail || `登录失败 (HTTP ${res.status})`);
  } catch (e) {
    fail(`无法连接控制台: ${e.message}`);
  }

  go.disabled = false;
  go.textContent = "进入控制台";
});
</script>

</body>
</html>
